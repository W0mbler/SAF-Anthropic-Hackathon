name: Publish GitHub Pages demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.lock.txt
      - run: pip install -r services/api/requirements.lock.txt
      - run: python scripts/build_pages_data.py
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm --prefix apps/web run build
        env:
          NEXT_PUBLIC_STATIC_DEMO: 'true'
          NEXT_PUBLIC_BASE_PATH: /SAF-Anthropic-Hackathon
      - run: npm ci --prefix e2e
      - run: cd e2e && npx playwright install --with-deps chromium
      - name: Test the static repository path
        run: |
          mkdir -p /tmp/pages-site
          ln -s "$PWD/apps/web/out" /tmp/pages-site/SAF-Anthropic-Hackathon
          python -m http.server 3002 --bind 127.0.0.1 --directory /tmp/pages-site >/tmp/pages-server.log 2>&1 &
          pages_server_pid=$!
          trap 'kill "$pages_server_pid"' EXIT
          PAGES_TEST=1 PLAYWRIGHT_BASE_URL=http://127.0.0.1:3002 npm --prefix e2e test -- pages.spec.ts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Check the published site
        env:
          PUBLISHED_URL: ${{ steps.deployment.outputs.page_url }}
        run: curl --fail --retry 6 --retry-all-errors --retry-delay 10 "$PUBLISHED_URL" --output /dev/null
